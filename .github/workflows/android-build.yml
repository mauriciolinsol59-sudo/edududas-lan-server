name: Build EduDudas Admin and User APKs

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build both APKs
        run: gradle --no-daemon :app:assembleDebug :app-user:assembleDebug
      - name: Upload administrator APK
        uses: actions/upload-artifact@v4
        with:
          name: edududas-administrador-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload common-user APK
        uses: actions/upload-artifact@v4
        with:
          name: edududas-uso-comun-apk
          path: app-user/build/outputs/apk/debug/app-user-debug.apk
          if-no-files-found: error
          retention-days: 14
